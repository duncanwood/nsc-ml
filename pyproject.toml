[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "swellar"
version = "0.1.0"
description = "Multi-band time-series outlier detection for gravitational microlensing in survey photometry"
requires-python = ">=3.11"   # uses warnings.catch_warnings(action=...) (added in 3.11)
dependencies = [
    # lower bounds match the validated environment (conda env "nsc", CPython
    # 3.11.9); requirements.txt pins the exact versions for reproducibility.
    "numpy>=1.23.5",
    "pandas>=2.2.2",
    "scipy>=1.11.4",
    "numba>=0.59.1",
    # pyarrow's floor stays at the validated 16.1.0 rather than the
    # CVE-2026-25087 fix (23.0.1, which requirements.txt does take): this is the
    # lower-bound path RUNNING_ON_RSP.md installs through, and raising it would
    # force an upgrade of rubin-env's conda-managed pyarrow. The advisory does
    # not reach us either way -- the vulnerable call is C++-only
    # (RecordBatchFileReader::PreBufferMetadata, unexposed in the Python
    # binding), and swellar reads parquet, never Arrow IPC.
    "pyarrow>=16.1.0",
    "tqdm>=4.66.3",   # CVE-2024-34062; a patch release, safe to require
    "matplotlib>=3.8.4",
]

[project.optional-dependencies]
test = ["pytest>=9.0"]

[tool.setuptools]
packages = ["swellar", "swellar.surveys"]
